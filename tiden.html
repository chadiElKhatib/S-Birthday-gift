<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Tid siden</title>

    <link rel="stylesheet" href="tiden.css" />
  </head>

  <body data-page="tid-siden">
    <div class="time-particles"></div>

    <main class="time-page">
      <section class="time-card">
        <p class="small-title">⏳ Tid siden</p>

        <h1>17. december 2025</h1>
        <p class="date-text">kl. 02:17</p>

        <div class="counter">
          <div class="time-box">
            <span id="months">0</span>
            <p>Måneder</p>
          </div>

          <div class="time-box">
            <span id="days">0</span>
            <p>Dage</p>
          </div>

          <div class="time-box">
            <span id="hours">0</span>
            <p>Timer</p>
          </div>

          <div class="time-box">
            <span id="minutes">0</span>
            <p>Minutter</p>
          </div>

          <div class="time-box">
            <span id="seconds">0</span>
            <p>Sekunder</p>
          </div>
        </div>

        <p class="message">Nogle datoer bliver bare siddende i hukommelsen.</p>

        <a href="index.html" id="backButton" class="back-button"> Tilbage </a>
      </section>
    </main>

    <script src="tracker.js"></script>
    <script src="tiden.js"></script>
  </body>
</html>
