<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#070d22" />

    <title>Tid siden</title>

    <link rel="stylesheet" href="assets/css/tiden.css" />
    <script src="assets/js/page-transition.js"></script>
  </head>

  <body data-page="tid-siden">
    <!-- Byens lys, sløret bag en våd rude om natten -->
    <div class="city-lights" aria-hidden="true"></div>
    <canvas id="rainGlass" class="rain-glass" aria-hidden="true"></canvas>
    <div class="glass-sheen" aria-hidden="true"></div>

    <main class="time-page">
      <section class="time-card">
        <p class="small-title">⏳ Tid siden</p>

        <h1>17. december 2025</h1>
        <p class="date-text">kl. 02:17</p>

        <div class="counter">
          <div class="time-box">
            <span id="months">0</span>
            <p>Måneder</p>
          </div>

          <div class="time-box">
            <span id="days">0</span>
            <p>Dage</p>
          </div>

          <div class="time-box">
            <span id="hours">0</span>
            <p>Timer</p>
          </div>

          <div class="time-box">
            <span id="minutes">0</span>
            <p>Minutter</p>
          </div>

          <div class="time-box">
            <span id="seconds">0</span>
            <p>Sekunder</p>
          </div>
        </div>

        <p class="message">Nogle datoer bliver bare siddende i hukommelsen.</p>

        <div class="time-links">
          <a href="index.html" id="backButton" class="back-button"> Tilbage </a>
          <a href="story.html" class="back-button"> 💬 Sidste ord </a>
        </div>
      </section>
    </main>

    <script src="assets/js/tracker.js"></script>
    <div class="sound-control">
      <button
        id="soundButton"
        class="sound-button"
        type="button"
        aria-label="Slå lyden til"
      >
        🔇
      </button>
      <span id="soundHint" class="sound-hint">Tryk for regnlyd</span>
    </div>

    <script src="assets/js/ambient-audio.js"></script>
    <script src="assets/js/tiden.js"></script>
  </body>
</html>
